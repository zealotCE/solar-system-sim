server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # 带内容哈希的构建产物可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /ephemerides/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 行星贴图体积较大且极少变动
    location /textures/ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    location /models/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
