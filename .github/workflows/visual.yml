name: Visual regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      LIBGL_ALWAYS_SOFTWARE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint and validate trajectories
        run: npm run lint && npm run validate:data

      - name: Build Pages output
        run: npm run build:pages

      - name: Preview and compare canvases
        run: npm run test:visual

      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_attempt }}
          path: |
            test-results/visual
            playwright-report
          if-no-files-found: warn
          retention-days: 14
